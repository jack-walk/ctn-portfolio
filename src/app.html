<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/montserrat-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/playfair-display-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: 'Montserrat';
        src: url('%sveltekit.assets%/fonts/montserrat-latin.woff2') format('woff2');
        font-style: normal;
        font-weight: 100 900;
        font-display: optional;
      }

      @font-face {
        font-family: 'Playfair Display';
        src: url('%sveltekit.assets%/fonts/playfair-display-latin.woff2') format('woff2');
        font-style: normal;
        font-weight: 400 900;
        font-display: optional;
      }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    %sveltekit.head%
  </head>
  <body>
    <div id="app">%sveltekit.body%</div>
  </body>
</html>
